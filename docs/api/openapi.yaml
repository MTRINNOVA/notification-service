openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description:
    Contrato REST multi-organización y multiaplicación. 202 Accepted confirma
    persistencia, no entrega. Meta Cloud API queda fuera de v1.
servers:
  - url: https://notifications-api.example.com/api/v1
    description: URL propuesta; sustituir por DNS definitivo
tags:
  - name: Public Notifications
  - name: Organizations
  - name: Applications
  - name: Users and Roles
  - name: Provider Accounts
  - name: WhatsApp Instances
  - name: Senders
  - name: Templates
  - name: Campaigns
  - name: Scheduling
  - name: Dashboard and Audit
  - name: Webhooks
  - name: Platform
    description:
      Operaciones globales de plataforma. Solo `super_admin` activo; siempre
      auditadas.
security: []
paths:
  /public/notifications:
    post:
      tags:
        - Public Notifications
      operationId: createNotification
      summary: Aceptar una notificación para procesamiento asíncrono
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: Aceptar una notificación para procesamiento asíncrono
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedNotification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: "202 confirma persistencia y aceptación; no implica entrega.


        Códigos de error específicos: IDEMPOTENCY_KEY_CONFLICT (409); SENDER_NOT_CONNECTED,
        DEFAULT_SENDER_NOT_CONFIGURED, SENDER_NOT_ASSIGNED_TO_APPLICATION, TEMPLATE_VARIABLES_MISSING,
        ATTACHMENT_NOT_AVAILABLE (422); WHATSAPP_DAILY_QUOTA_EXCEEDED, APPLICATION_DAILY_LIMIT_EXCEEDED,
        RATE_LIMIT_EXCEEDED (429). Un adjunto de otra organización o aplicación responde
        404."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Correlation-Id
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
    get:
      tags:
        - Public Notifications
      operationId: listNotifications
      summary: Listar notificaciones de la aplicación
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Listar notificaciones de la aplicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
  /public/notifications/bulk:
    post:
      tags:
        - Public Notifications
      operationId: createBulkNotifications
      summary: Aceptar un lote acotado
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: Aceptar un lote acotado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBulkNotificationsRequest"
      description:
        "Códigos de error específicos: IDEMPOTENCY_KEY_CONFLICT (409);
        SENDER_NOT_CONNECTED, DEFAULT_SENDER_NOT_CONFIGURED, SENDER_NOT_ASSIGNED_TO_APPLICATION,
        TEMPLATE_VARIABLES_MISSING, ATTACHMENT_NOT_AVAILABLE (422); WHATSAPP_DAILY_QUOTA_EXCEEDED,
        APPLICATION_DAILY_LIMIT_EXCEEDED, RATE_LIMIT_EXCEEDED (429). Un adjunto de
        otra organización o aplicación responde 404."
  /public/notifications/{notificationId}:
    get:
      tags:
        - Public Notifications
      operationId: getNotificationById
      summary: Consultar notificación
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Consultar notificación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /public/notifications/{notificationId}/events:
    get:
      tags:
        - Public Notifications
      operationId: listNotificationEvents
      summary: Consultar eventos
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Consultar eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
  /public/notifications/{notificationId}/cancel:
    post:
      tags:
        - Public Notifications
      operationId: cancelNotification
      summary: Cancelar notificación pendiente
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Cancelar notificación pendiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description:
        "Códigos de error específicos: NOTIFICATION_ALREADY_DISPATCHED
        (409)."
  /public/notifications/{notificationId}/retry:
    post:
      tags:
        - Public Notifications
      operationId: retryNotification
      summary: Solicitar reenvío manual
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: Reenvío aceptado (nueva notificación)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedNotification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description:
        "Reenvío manual (TP-19, TP-21): lo solicita la **aplicación consumidora**
        autenticada con su API Key, que debe tener el scope `notifications.retry`;
        el actor es la aplicación, nunca un usuario humano. Crea una **nueva** notificación
        y una nueva entrega vinculadas a la original mediante `resendOfNotificationId`,
        con nueva Idempotency-Key y motivo obligatorio, y consume cuota una vez al aceptarse.
        No modifica el historial de la original. Solo se admite si la original está
        `FAILED` y su entrega no requiere conciliación. La auditoría registra la aplicación
        y la API Key de origen. Los reintentos técnicos son automáticos y no se solicitan
        por API.


        Códigos de error específicos: IDEMPOTENCY_KEY_CONFLICT, NOTIFICATION_NOT_RETRYABLE
        (409); SENDER_NOT_CONNECTED, DEFAULT_SENDER_NOT_CONFIGURED, SENDER_NOT_ASSIGNED_TO_APPLICATION,
        TEMPLATE_VARIABLES_MISSING, ATTACHMENT_NOT_AVAILABLE (422); WHATSAPP_DAILY_QUOTA_EXCEEDED,
        APPLICATION_DAILY_LIMIT_EXCEEDED, RATE_LIMIT_EXCEEDED (429)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendNotificationRequest"
  /public/attachments:
    post:
      tags:
        - Public Notifications
      operationId: uploadAttachment
      summary: Subir adjunto
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: Subir adjunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
      description:
        "Códigos de error específicos: PAYLOAD_TOO_LARGE (413); UNSUPPORTED_MEDIA_TYPE
        (415)."
  /public/attachments/{attachmentId}:
    get:
      tags:
        - Public Notifications
      operationId: getAttachment
      summary: Consultar metadatos de adjunto
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Consultar metadatos de adjunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
