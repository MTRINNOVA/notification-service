components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description:
        API Key de una aplicación consumidora. Los permisos son scopes propios de la
        aplicación (p.ej. `notifications.send`, `notifications.retry`); no hereda roles
        humanos. El actor de estas operaciones es la aplicación.
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ActionResult:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type: string
        correlationId:
          type: string
    AcceptedNotification:
      type: object
      required:
        - notificationId
        - status
        - acceptedAt
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACCEPTED
            - QUEUED
          description:
            Subconjunto de NotificationPublicStatus en el momento de la
            aceptación.
        acceptedAt:
          type: string
          format: date-time
        correlationId:
          type: string
        resendOfNotificationId:
          type:
            - string
            - "null"
          format: uuid
          description: Notificación original cuando esta es un reenvío manual.
    CreateNotificationRequest:
      type: object
      required:
        - channel
        - recipient
      properties:
        channel:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
            - SMS
        recipient:
          oneOf:
            - type: string
