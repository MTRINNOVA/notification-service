  /management/auth/login:
    post:
      tags:
        - Authentication
      operationId: login
      summary: Iniciar sesión de usuario
      description:
        "Valida `Origin` (obligatorio; debe ser el origen del panel) y las
        credenciales, crea la sesión del panel (familia de refresh tokens) y emite el
        refresh token y el token CSRF de esa sesión. El refresh token
        se entrega solo en la cookie `refresh` (`Set-Cookie`, ver `RefreshCookie`); nunca
        en el cuerpo. El token CSRF se devuelve en `csrfToken` y el panel lo conserva
        solo en memoria. No requiere `X-CSRF-Token`, porque aún no existe sesión.
        Devuelve `sessionExpiresAt` y `sessionExpiresIn` (sesión de 60 minutos).
        Si la petición trae una cookie `refresh` válida, esa sesión anterior se revoca al
        crear la nueva: así se reautentica el usuario desde el aviso de cierre del panel,
        sin dejar dos sesiones vivas."
      security: []
      responses:
        "200":
          description: Iniciar sesión de usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
  /management/auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshSession
      summary: Rotar refresh token y emitir access token
      security:
        - RefreshCookie: []
          CsrfHeader: []
      responses:
        "200":
          description: Rotar refresh token y emitir access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      description:
        "Requiere a la vez la cookie `refresh` y la cabecera `X-CSRF-Token`. El refresh token opaco viaja en una cookie `HttpOnly`, `Secure` en
        producción, `SameSite=Strict` y limitada a la ruta `/api/v1/management/auth`.
        El backend exige y valida `Origin`, obtiene la sesión a partir de la cookie y compara
        el `X-CSRF-Token` recibido con el token CSRF asociado a esa sesión, almacenado
        como hash (token sincronizado con la sesión). Si todo es válido, rota
        el refresh token (un solo uso), reemite la cookie y genera un **nuevo** token
        CSRF, que se devuelve en `csrfToken`; el token CSRF anterior deja de ser válido.
        Si se presenta un refresh token ya usado, se revoca toda su familia, se elimina
        la cookie, se audita la reutilización y se responde 401. La sesión vence a los
        60 minutos del login aunque se renueve; después, 401 y nuevo login. Cookie ausente, expirada,
        revocada o reutilizada: 401 AUTHENTICATION_REQUIRED. Token CSRF ausente o que
        no coincide, u `Origin` ausente o no permitido: 403 PERMISSION_DENIED. El `detail` es
        genérico y no indica qué comprobación falló."
  /management/auth/logout:
    post:
      tags:
        - Authentication
      operationId: logout
      summary: Cerrar sesión y revocar refresh token
      security:
        - RefreshCookie: []
          CsrfHeader: []
      responses:
        "204":
          description: Sesión revocada; cookie eliminada.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      description:
        "Requiere a la vez la cookie `refresh` y la cabecera `X-CSRF-Token`
        vigente. El backend valida `Origin`, la sesión y el token CSRF
        asociado a ella; después revoca la sesión (familia de refresh tokens), invalida
        el refresh token y el token CSRF, y elimina la cookie (`Max-Age=0`, con la misma
        ruta y atributos con que se emitió). Cookie ausente o inválida: 401 AUTHENTICATION_REQUIRED.
        Token CSRF ausente o que no coincide, u `Origin` ausente o no permitido: 403
        PERMISSION_DENIED. El `detail` es genérico y no indica qué comprobación falló."
  /management/auth/session:
    post:
      tags:
        - Authentication
      operationId: resumeSession
      summary: Recuperar la sesión al cargar el panel
      description:
        "Arranque del panel tras recargar la página o abrir otra pestaña, cuando
        ya no hay `csrfToken` en memoria. Requiere solo la cookie `refresh` y un `Origin`
        obligatorio igual al origen del panel; **no** requiere `X-CSRF-Token`. Su protección
        anti-CSRF se apoya en `SameSite=Strict`, la validación de `Origin` y un CORS restrictivo
        que impide a otro origen leer la respuesta. Hace lo mismo que `refreshSession`:
        rota el refresh token (con detección de reutilización), reemite la cookie y devuelve
        un `accessToken` y un `csrfToken` nuevos, sin alargar el vencimiento de la sesión
        (60 minutos desde el login). El token CSRF anterior deja de valer.
        El panel debe serializar `resumeSession` y `refreshSession` entre pestañas y compartir
        los tokens nuevos en memoria (contrato del panel). Cookie ausente, expirada, revocada
        o reutilizada: 401 AUTHENTICATION_REQUIRED. `Origin` ausente o no permitido: 403
        PERMISSION_DENIED. El `detail` es genérico."
      security:
        - RefreshCookie: []
      responses:
        "200":
          description: Sesión recuperada; cookie reemitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /management/auth/password:
    post:
      tags:
        - Authentication
      operationId: changePassword
      summary: Cambiar la contraseña propia
      description:
        "Sustituye la contraseña del usuario autenticado. Es la única forma
        de salir de `mustChangePassword`. Si es correcta, guarda el nuevo hash Argon2id,
        pone `mustChangePassword = false` y revoca las demás sesiones del usuario. La
        sesión actual sigue activa. Contraseña actual incorrecta o nueva contraseña
        que no cumple la política → 422 PASSWORD_CHANGE_REJECTED, sin indicar cuál de
        las dos falló.


        Códigos de error específicos: PASSWORD_CHANGE_REJECTED (422)."
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
