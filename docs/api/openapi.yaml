components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description:
        API Key de una aplicación consumidora. Los permisos son scopes propios de la
        aplicación (catálogo cerrado `ApiKeyScope`); no hereda roles humanos. El actor
        de estas operaciones es la aplicación. Cada operación de la Public API declara
        su scope en la extensión `x-required-scopes`.
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        Access token del panel. Mientras el usuario tenga `mustChangePassword`,
        solo se admiten `getCurrentUser`, `changePassword`, `refreshSession`, `resumeSession`
        y `logout`; el resto responde 403 PASSWORD_CHANGE_REQUIRED.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh
      description:
        Refresh token opaco del panel. Cookie `HttpOnly`, `Secure` en
        producción, `SameSite=Strict`, `Path=/api/v1/management/auth` y caducidad
        igual a la vigencia restante de la sesión, como máximo 60 minutos desde el
        login; las rotaciones no la alargan. Se rota en cada uso y se elimina al
        cerrar sesión o al detectar reutilización. Solo la aceptan `refreshSession`,
        `logout` (junto con `CsrfHeader`) y `resumeSession` (sola, con `Origin` obligatorio); no es un esquema global.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description:
        Token anti-CSRF **sincronizado con la sesión**, obligatorio junto
        con `RefreshCookie` en las operaciones autenticadas por cookie. Su valor
        es el `csrfToken` devuelto por el último login o refresh correcto. El backend
        lo compara con el hash asociado a la sesión que identifica la cookie. Nunca
        viaja en la URL ni en una cookie legible (no se usa doble envío).
  schemas:
    ActionResult:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type: string
        correlationId:
          type: string
    AcceptedNotification:
      type: object
      required:
        - notificationId
        - status
        - acceptedAt
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACCEPTED
            - QUEUED
          description:
            Subconjunto de NotificationPublicStatus en el momento de la
            aceptación.
        acceptedAt:
          type: string
          format: date-time
        correlationId:
          type: string
        resendOfNotificationId:
          type:
            - string
            - "null"
          format: uuid
          description: Notificación original cuando esta es un reenvío manual.
    CreateNotificationRequest:
      type: object
      required:
        - channel
        - recipient
      properties:
        channel:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
            - SMS
        recipient:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        senderId:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/TemplateReference"
        content:
          type: object
          additionalProperties: true
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
          description:
            Adjuntos subidos previamente por la misma aplicación. Se asocian
            vía notification_attachments sin duplicar el archivo; un adjunto puede
            reutilizarse en varias notificaciones de la misma aplicación mientras
            no esté eliminado, expirado ni bloqueado por el escaneo.
          uniqueItems: true
        scheduledAt:
          type: string
          format: date-time
          description:
            Ejecución diferida. Se valida al aceptar, pero la cuota diaria se reserva
            al ejecutarse, en el día local de ejecución de la organización.
        metadata:
          type: object
          additionalProperties:
            type: string
          description:
            Metadatos libres del cliente (p. ej. módulo o usuario de origen). Se
            persisten tal cual (`notifications.metadata_json`) y no se usan para
            autorización. No deben contener secretos ni datos personales innecesarios.
        security:
          $ref: "#/components/schemas/EncryptionOptions"
      oneOf:
        - required:
            - template
        - required:
            - content
    EncryptionOptions:
      type: object
      description:
        "Cifrado del contenido. Lo aplica el servicio antes de entregar al
        proveedor; no lo hace el proveedor. Combinaciones admitidas: `PGP` solo en
        EMAIL (cuerpo y adjuntos, con `pgpPublicKey`); `ZIP_AES256` en EMAIL y WHATSAPP
        y solo con adjuntos (empaqueta los adjuntos en un ZIP AES-256 con `zipPassword`);
        `TLS_ONLY` solo en EMAIL (exige TLS en el transporte SMTP); `NONE` en todos los
        canales. SMS solo admite `NONE`. Otra combinación → 422 ENCRYPTION_OPTIONS_INVALID.
        `zipPassword` se guarda cifrado fuera del dominio, nunca viaja en mensajes de
        RabbitMQ ni aparece en logs o respuestas."
      required:
        - encryption
      properties:
        encryption:
          type: string
          default: NONE
          enum:
            - NONE
            - TLS_ONLY
            - ZIP_AES256
            - PGP
        zipPassword:
          type: string
          format: password
          writeOnly: true
          description: Obligatoria con `ZIP_AES256`; prohibida en los demás modos.
        pgpPublicKey:
          type: string
          description:
            Clave pública OpenPGP en formato armored del destinatario. Obligatoria
            con `PGP`; una clave inválida → 422 ENCRYPTION_OPTIONS_INVALID.
    CreateBulkNotificationsRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/CreateNotificationRequest"
    AcceptedBatch:
      type: object
      description:
        "Resultado de un lote (aceptación parcial). Cada ítem se valida y
        acepta o rechaza por separado: los válidos se aceptan (y consumen cuota) y los
        inválidos se informan en `items` con su código de error. El lote completo es
        idempotente por `Idempotency-Key`."
      required:
        - batchId
        - status
        - acceptedCount
        - rejectedCount
        - items
      properties:
        batchId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACCEPTED
            - PARTIALLY_ACCEPTED
            - REJECTED
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/BatchItemResult"
    BatchItemResult:
      type: object
      required:
        - index
        - result
      properties:
        index:
          type: integer
          minimum: 0
          description: Posición del ítem en `items` de la solicitud.
        result:
          type: string
          enum:
            - ACCEPTED
            - REJECTED
        notificationId:
          type:
            - string
            - "null"
          format: uuid
          description: Solo para ítems aceptados.
        error:
          oneOf:
            - type: "null"
            - type: object
              required:
                - status
                - code
              properties:
                status:
                  type: integer
                  description: Código HTTP que tendría el error en un envío individual.
                code:
                  type: string
                  description: Código del catálogo de errores (p. ej. SENDER_NOT_CONNECTED, WHATSAPP_DAILY_QUOTA_EXCEEDED).
                detail:
                  type: string
    NotificationStatus:
      type: object
      required:
        - notificationId
        - channel
        - status
        - createdAt
      properties:
        notificationId:
          type: string
          format: uuid
        channel:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
            - SMS
        status:
          $ref: "#/components/schemas/NotificationPublicStatus"
        encryption:
          type: string
          description: Modo de cifrado solicitado. Nunca incluye secretos.
          enum:
            - NONE
            - TLS_ONLY
            - ZIP_AES256
            - PGP
        batchId:
          type:
            - string
            - "null"
          format: uuid
          description: Lote de origen, si la notificación llegó por `createBulkNotifications`.
        recipient:
          type: object
          additionalProperties: true
        senderId:
          type: string
          format: uuid
        providerMessageId:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          description: Aceptación por el proveedor.
        deliveredAt:
          type: string
          format: date-time
