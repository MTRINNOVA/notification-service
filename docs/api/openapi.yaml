          type: integer
          minimum: 0
          description:
            Total de resultados que coinciden con los filtros aplicados, antes
            de paginar.
    RotateCredentialsRequest:
      type: object
      properties:
        credentials:
          type: object
          additionalProperties:
            type: string
    DeliveryMetrics:
