            code: DEFAULT_SENDER_NOT_CONFIGURED
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    TooManyRequests:
      description:
        "Cuota o rate limit excedido. Códigos: WHATSAPP_DAILY_QUOTA_EXCEEDED,
        APPLICATION_DAILY_LIMIT_EXCEEDED, RATE_LIMIT_EXCEEDED. Incluye `Retry-After`
        y `retryAt` cuando son calculables."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: WhatsApp daily quota exceeded
            status: 429
            detail: WhatsApp daily quota exceeded.
            instance: /api/v1/...
            code: WHATSAPP_DAILY_QUOTA_EXCEEDED
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
