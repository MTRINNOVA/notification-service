            title: Provider temporarily unavailable
            status: 503
            detail: Provider temporarily unavailable.
            instance: /api/v1/...
            code: PROVIDER_TEMPORARILY_UNAVAILABLE
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  headers:
    RetryAfter:
      description:
        Segundos (o fecha HTTP) que el cliente debe esperar antes de reintentar.
        Se incluye cuando es calculable.
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description:
        Obligatorio para crear envíos, lotes, campañas y programaciones.
        Misma clave y mismo cuerpo devuelven el recurso original; misma clave con
        cuerpo distinto → 409 IDEMPOTENCY_KEY_CONFLICT.
      schema:
        type: string
        minLength: 8
        maxLength: 128
