openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description:
    Contrato REST multi-organización y multiaplicación. 202 Accepted confirma
    persistencia, no entrega. Meta Cloud API queda fuera de v1.
servers:
  - url: https://notifications-api.example.com/api/v1
    description: URL propuesta; sustituir por DNS definitivo
tags:
  - name: Public Notifications
  - name: Organizations
  - name: Applications
  - name: Users and Roles
  - name: Provider Accounts
  - name: WhatsApp Instances
  - name: Senders
  - name: Templates
  - name: Campaigns
  - name: Scheduling
  - name: Dashboard and Audit
  - name: Webhooks
  - name: Management Notifications
    description:
      Operaciones del panel sobre notificaciones (JWT + membresía). Reutilizan
      los casos de uso de la Public API.
  - name: Platform
    description:
      Operaciones globales de plataforma. Solo `super_admin` activo; siempre
      auditadas.
security: []
paths:
  /public/notifications:
    post:
      tags:
        - Public Notifications
      operationId: createNotification
      summary: Aceptar una notificación para procesamiento asíncrono
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - notifications.send
      responses:
        "202":
          description: Aceptar una notificación para procesamiento asíncrono
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedNotification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description:
        "202 confirma persistencia y aceptación; no implica entrega. Con `scheduledAt`
        la cuota diaria no se reserva al aceptar, sino al ejecutarse, así que
        un envío programado no devuelve los 429 de cuota diaria.


        Códigos de error específicos: IDEMPOTENCY_KEY_CONFLICT (409); SENDER_NOT_CONNECTED,
        DEFAULT_SENDER_NOT_CONFIGURED, SENDER_NOT_ASSIGNED_TO_APPLICATION, TEMPLATE_VARIABLES_MISSING,
        ATTACHMENT_NOT_AVAILABLE, ENCRYPTION_OPTIONS_INVALID (422); WHATSAPP_DAILY_QUOTA_EXCEEDED,
        APPLICATION_DAILY_LIMIT_EXCEEDED, RATE_LIMIT_EXCEEDED (429). Un adjunto de otra
        organización o aplicación responde 404."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Correlation-Id
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
    get:
      tags:
        - Public Notifications
      operationId: listNotifications
      summary: Listar notificaciones de la aplicación
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - notifications.read
      responses:
        "200":
          description: Listar notificaciones de la aplicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
  /public/notifications/bulk:
    post:
      tags:
        - Public Notifications
      operationId: createBulkNotifications
      summary: Aceptar un lote acotado
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - notifications.send
      responses:
        "202":
          description: Aceptar un lote acotado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBulkNotificationsRequest"
      description:
        "Aceptación parcial: cada ítem se valida por separado. Los válidos
        se aceptan en una transacción por ítem (notificación, reserva de cuota y outbox)
        y los inválidos se informan en `items` con el código que tendrían en un envío
        individual (p. ej. SENDER_NOT_CONNECTED, ATTACHMENT_NOT_AVAILABLE, WHATSAPP_DAILY_QUOTA_EXCEEDED,
        ENCRYPTION_OPTIONS_INVALID o 404 RESOURCE_NOT_FOUND para un adjunto ajeno). Se
        responde 202 con el resultado aunque se rechacen todos los ítems (`status = REJECTED`).
        El lote se persiste (`notification_batches`) y es idempotente por `Idempotency-Key`.


        Códigos de error del lote completo: IDEMPOTENCY_KEY_CONFLICT (409); RATE_LIMIT_EXCEEDED
        (429)."
  /public/notifications/{notificationId}:
    get:
      tags:
        - Public Notifications
      operationId: getNotificationById
      summary: Consultar notificación
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - notifications.read
      responses:
        "200":
          description: Consultar notificación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /public/notifications/{notificationId}/events:
    get:
      tags:
        - Public Notifications
      operationId: listNotificationEvents
      summary: Consultar eventos
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - notifications.read
      responses:
        "200":
          description: Consultar eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
  /public/notifications/{notificationId}/cancel:
    post:
      tags:
        - Public Notifications
      operationId: cancelNotification
      summary: Cancelar notificación pendiente
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - notifications.cancel
      responses:
        "200":
          description: Cancelar notificación pendiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description:
        "Cancela una notificación cuya entrega aún no salió hacia el proveedor
        (entrega `PENDING`, `QUEUED` o `RETRY_PENDING`). Comparte caso de uso y semántica
        con `cancelManagementNotification`.


        Códigos de error específicos: RESOURCE_STATE_CONFLICT (409): la notificación
        ya está cancelada; NOTIFICATION_ALREADY_DISPATCHED (409): la entrega ya salió
        hacia el proveedor. Una cancelación repetida no es idempotente: no devuelve
        200."
  /management/notifications/{notificationId}/cancel:
    post:
      tags:
        - Management Notifications
      operationId: cancelManagementNotification
      summary: Cancelar notificación pendiente desde el panel
      description:
        "Cancelación solicitada por un usuario del panel. Reutiliza el mismo
        caso de uso de cancelación que `cancelNotification` (Public API); solo cambian
        la autenticación y el actor auditado.


        Autorización: JWT del panel con membresía activa en la organización seleccionada
        y permiso de rol `notifications.cancel`: `organization_admin` dentro de su
        organización; `operator` solo si su rol tiene ese permiso; `viewer` nunca. `super_admin`
        puede cancelar en cualquier organización (cancelación global), siempre auditada.
        La organización se deriva del principal y de la membresía, nunca de la ruta:
        una notificación inexistente o de otra organización responde 404 sin revelar
        su existencia.


        Estados que admiten cancelación: entrega en `PENDING`, `QUEUED` o `RETRY_PENDING`
        (estado público `ACCEPTED` o `QUEUED`), incluidas las programadas que aún no se
        ejecutaron. Una entrega que ya salió hacia el proveedor (`IN_PROGRESS`, `PROVIDER_ACCEPTED`,
        `RECONCILIATION_REQUIRED`, `DELIVERED`, `READ`, `FAILED`, `DEAD_LETTER`) no se
        cancela ni se transforma en `CANCELLED`. La auditoría registra `actor_type = USER`,
        el usuario, la organización, la notificación y el resultado, también cuando se
        rechaza.


        Códigos de error específicos: RESOURCE_STATE_CONFLICT (409): la notificación
        ya está cancelada (misma regla que la Public API, sin idempotencia
        con 200); NOTIFICATION_ALREADY_DISPATCHED (409): la entrega ya salió hacia el
        proveedor. Permiso insuficiente: PERMISSION_DENIED (403)."
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Notificación cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /public/notifications/{notificationId}/retry:
    post:
      tags:
        - Public Notifications
      operationId: retryNotification
      summary: Solicitar reenvío manual
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - notifications.retry
      responses:
        "202":
          description: Reenvío aceptado (nueva notificación)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedNotification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description:
        "Reenvío manual: lo solicita la **aplicación consumidora**
        autenticada con su API Key, que debe tener el scope `notifications.retry`;
        el actor es la aplicación, nunca un usuario humano. Crea una **nueva** notificación
        y una nueva entrega vinculadas a la original mediante `resendOfNotificationId`,
        con nueva Idempotency-Key y motivo obligatorio, y consume cuota una vez al aceptarse.
        No modifica el historial de la original. Solo se admite si la original está
        `FAILED` y su entrega no requiere conciliación. Una notificación `ZIP_AES256` no
        se puede reenviar, porque su contraseña ZIP se borra al llegar a un estado terminal: responde 409 NOTIFICATION_NOT_RETRYABLE y el cliente debe crear una
        notificación nueva. La auditoría registra la aplicación y la API Key de origen.
        Los reintentos técnicos son automáticos y no se solicitan por API.


        Códigos de error específicos: IDEMPOTENCY_KEY_CONFLICT, NOTIFICATION_NOT_RETRYABLE
        (409); SENDER_NOT_CONNECTED, DEFAULT_SENDER_NOT_CONFIGURED, SENDER_NOT_ASSIGNED_TO_APPLICATION,
        TEMPLATE_VARIABLES_MISSING, ATTACHMENT_NOT_AVAILABLE (422); WHATSAPP_DAILY_QUOTA_EXCEEDED,
        APPLICATION_DAILY_LIMIT_EXCEEDED, RATE_LIMIT_EXCEEDED (429)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendNotificationRequest"
  /public/attachments:
    post:
      tags:
        - Public Notifications
      operationId: uploadAttachment
      summary: Subir adjunto
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - attachments.upload
      responses:
        "201":
          description: Subir adjunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
      description:
        "Códigos de error específicos: PAYLOAD_TOO_LARGE (413); UNSUPPORTED_MEDIA_TYPE
        (415)."
  /public/attachments/{attachmentId}:
    get:
      tags:
        - Public Notifications
      operationId: getAttachment
      summary: Consultar metadatos de adjunto
      description:
        "Scope requerido: `attachments.read`, independiente de `attachments.upload`.
        La lectura está limitada a la organización y la aplicación propietarias del
        adjunto, derivadas de la API Key; un adjunto de otra aplicación u organización
        responde 404 sin revelar su existencia. Si la respuesta incluye `downloadUrl`,
        es una URL firmada temporal (`expiresAt`) que no expone credenciales, endpoints
        internos ni nombres de bucket u objeto de MinIO."
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - attachments.read
      responses:
        "200":
          description: Consultar metadatos de adjunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /public/templates:
    get:
      tags:
        - Public Notifications
      operationId: listPublicTemplates
      summary: Listar plantillas disponibles
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - templates.read
      responses:
        "200":
          description: Listar plantillas disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
  /public/templates/{code}:
    get:
      tags:
        - Public Notifications
      operationId: getPublicTemplate
      summary: Consultar plantilla publicada
      security:
        - ApiKeyAuth: []
      x-required-scopes:
        - templates.read
      responses:
        "200":
          description: Consultar plantilla publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
  /management/organizations:
    get:
      tags:
        - Organizations
      operationId: listOrganizations
      summary: Listar organizacións
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Listar organizacións
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
    post:
      tags:
        - Organizations
      operationId: createOrganization
      summary: Crear organización
      security:
        - AdminBearer: []
      responses:
        "201":
          description: Crear organización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      description: "Códigos de error específicos: RESOURCE_ALREADY_EXISTS (409)."
  /management/organizations/{resourceId}:
    get:
      tags:
        - Organizations
      operationId: getOrganization
      summary: Consultar organización
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Consultar organización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
    put:
      tags:
        - Organizations
      operationId: updateOrganization
      summary: Actualizar organización
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Actualizar organización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
  /management/applications:
    get:
      tags:
        - Applications
      operationId: listApplications
      summary: Listar aplicacións
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Listar aplicacións
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
    post:
      tags:
        - Applications
      operationId: createApplication
      summary: Crear aplicación
      security:
        - AdminBearer: []
      responses:
        "201":
          description: Crear aplicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      description: "Códigos de error específicos: RESOURCE_ALREADY_EXISTS (409)."
  /management/applications/{resourceId}:
    get:
      tags:
        - Applications
      operationId: getApplication
      summary: Consultar aplicación
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Consultar aplicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
    put:
      tags:
        - Applications
      operationId: updateApplication
      summary: Actualizar aplicación
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Actualizar aplicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
