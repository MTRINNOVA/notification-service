components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ActionResult:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        correlationId:
          type: string
    AcceptedNotification:
      type: object
      required:
      - notificationId
      - status
      - acceptedAt
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACCEPTED
          - QUEUED
        acceptedAt:
          type: string
          format: date-time
        correlationId:
          type: string
    CreateNotificationRequest:
      type: object
      required:
      - channel
      - recipient
      properties:
        channel:
          type: string
          enum:
          - WHATSAPP
          - EMAIL
          - SMS
        recipient:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
        senderId:
          type: string
          format: uuid
        template:
          $ref: '#/components/schemas/TemplateReference'
        content:
          type: object
          additionalProperties: true
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
        scheduledAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
      oneOf:
      - required:
        - template
      - required:
        - content
    CreateBulkNotificationsRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CreateNotificationRequest'
    AcceptedBatch:
      type: object
      required:
      - batchId
      - acceptedCount
      properties:
        batchId:
          type: string
          format: uuid
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
        status:
          type: string
    NotificationStatus:
      type: object
      required:
      - notificationId
      - channel
      - status
      - createdAt
      properties:
        notificationId:
          type: string
          format: uuid
        channel:
          type: string
        status:
          type: string
        recipient:
          type: object
          additionalProperties: true
        senderId:
          type: string
          format: uuid
        providerMessageId:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
        errorCode:
          type: string
    EventPage:
