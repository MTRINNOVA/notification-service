        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderHealth"
        page:
          type: integer
          minimum: 1
          description: Número de página devuelto (base 1).
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: Tamaño de página aplicado.
        total:
          type: integer
          minimum: 0
          description:
            Total de resultados que coinciden con los filtros aplicados, antes
            de paginar.
    AuditEventPage:
      type: object
      description:
        Página de resultados. `total` es el número de resultados que
        coinciden con los filtros aplicados, antes de paginar.
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          type: integer
          minimum: 1
          description: Número de página devuelto (base 1).
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: Tamaño de página aplicado.
        total:
          type: integer
          minimum: 0
          description:
            Total de resultados que coinciden con los filtros aplicados, antes
            de paginar.
    OrganizationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ApplicationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    RolePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ProblemDetails:
      type: object
      description:
        RFC 9457 Problem Details. `code` toma valores del catálogo cerrado
        docs/api/error-codes.md.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
          description:
            URI del tipo de problema ({PROBLEM_TYPE_BASE_URI}/{code-en-kebab-case});
            `about:blank` mientras no exista la base definitiva.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explicación de la ocurrencia, sin datos internos ni secretos.
        instance:
          type: string
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description:
            Código estable del catálogo docs/api/error-codes.md. Los clientes
            deciden según este valor.
        traceId:
          type: string
        retryAt:
          type: string
          format: date-time
          description: Instante UTC a partir del cual se puede reintentar (429).
        errors:
          type: object
          description: Errores por campo (400).
          additionalProperties:
            type: array
            items:
              type: string
    CampaignPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ScheduledNotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledNotification"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    OrganizationLimits:
      type: object
      description:
        "Límites de la organización por canal. `dailyLimit` nulo = sin
        límite diario en ese canal. El límite efectivo de una aplicación es el menor
        entre el suyo y el de la organización. WhatsApp se crea con 500 por día."
      required:
        - organizationId
        - limits
      properties:
        organizationId:
          type: string
          format: uuid
        limits:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationChannelLimit"
    OrganizationChannelLimit:
      type: object
      required:
        - channel
      properties:
        channel:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
            - SMS
        dailyLimit:
          type:
            - integer
            - "null"
          minimum: 0
        ratePerMinute:
          type:
            - integer
            - "null"
          minimum: 1
    SetOrganizationLimitsRequest:
      type: object
      required:
        - limits
        - reason
      properties:
        limits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrganizationChannelLimit"
        reason:
          type: string
          minLength: 1
          description: Motivo obligatorio, auditado.
    ResetTemporaryPasswordRequest:
      type: object
      required:
        - temporaryPassword
        - reason
      properties:
        temporaryPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description:
            Nueva contraseña temporal. Cumple la política de contraseñas;
            nunca se devuelve ni se registra.
        reason:
          type: string
          minLength: 1
          description: Motivo obligatorio, auditado.
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
        newPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description:
            "Política de contraseñas: entre 12 y 128 caracteres Unicode, espacios incluidos; sin reglas de composición ni caducidad periódica; se rechazan las de la lista de contraseñas comunes o filtradas y las iguales al email. Además, debe ser distinta de la actual."
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      description:
        Respuesta de `login` y `refreshSession`. El refresh token no forma parte
        del cuerpo; viaja solo en la cookie `refresh`.
      required:
        - csrfToken
        - sessionExpiresAt
        - sessionExpiresIn
      properties:
        sessionExpiresAt:
          type: string
          format: date-time
          description:
            Vencimiento absoluto de la sesión en UTC (login + 60 minutos).
            Igual en todas las respuestas de la misma sesión; rotar no lo cambia.
        sessionExpiresIn:
          type: integer
          minimum: 0
          description:
            Segundos que faltan para el vencimiento de la sesión al emitir la respuesta. El panel calcula la cuenta atrás con este valor, no con su propio
            reloj, y avisa 5 minutos antes.
        csrfToken:
          type: string
          description:
            Token CSRF de la sesión, de 32 bytes aleatorios (256 bits) de un
            generador criptográficamente seguro, codificados como texto opaco; el backend
            guarda solo su SHA-256 y lo compara en tiempo constante. Cada login y cada refresh correcto devuelven
            uno nuevo e invalidan el anterior. El panel lo conserva solo en memoria
            (nunca en `localStorage`, `sessionStorage`, cookies ni URLs) y lo envía
            en `X-CSRF-Token`.
        accessToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/CurrentUser"
    CurrentUser:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        activeOrganizationId:
          type: string
          format: uuid
        mustChangePassword:
          type: boolean
          description:
            "`true` mientras el usuario conserve la contraseña temporal.
            Solo puede usar `getCurrentUser`, `changePassword`, `refreshSession`,
            `resumeSession` y `logout`; el resto responde 403 PASSWORD_CHANGE_REQUIRED."
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        platformRoles:
          type: array
          description:
            Privilegios de plataforma activos del usuario (platform_role_assignments),
            independientes de las membresías.
          items:
            type: string
            enum:
              - super_admin
    SelectOrganizationRequest:
      type: object
      required:
        - organizationId
      properties:
        organizationId:
          type: string
          format: uuid
    NotificationPublicStatus:
      type: string
      description:
        Estado público de la notificación, derivado del estado de entrega
        (ADR-0012). SENT = aceptada por el proveedor, no entregada. DELIVERED y READ
        solo con evidencia del proveedor y según sus capacidades. Durante una conciliación
        por resultado ambiguo el estado es PROCESSING; los estados internos de entrega
        no se exponen.
      enum:
        - ACCEPTED
        - QUEUED
        - PROCESSING
        - SENT
        - DELIVERED
        - READ
        - FAILED
        - CANCELLED
    RolePermissionCode:
      type: string
      description:
        Catálogo cerrado de permisos de rol humanos. Distinto del catálogo
        de scopes de API Key (`ApiKeyScope`).
      enum:
        - members.manage
        - applications.manage
        - api_keys.manage
        - providers.manage
        - whatsapp.connect
        - senders.assign
        - templates.manage
        - notifications.read
        - notifications.cancel
        - campaigns.manage
        - campaigns.read
        - scheduling.manage
        - dashboard.read
        - audit.read
    SetRolePermissionsRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RolePermissionCode"
          description: Códigos del catálogo `permissions` de la plataforma.
    PlatformRoleAssignment:
      type: object
      required:
        - assignmentId
        - userId
        - roleCode
        - grantedByActorType
        - createdAt
      properties:
        assignmentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        roleCode:
          type: string
          enum:
            - super_admin
        grantedByActorType:
          type: string
          enum:
            - USER
            - SYSTEM_BOOTSTRAP
        grantedBy:
          type:
            - string
            - "null"
          format: uuid
          description: Usuario que concedió; null cuando grantedByActorType = SYSTEM_BOOTSTRAP.
        grantReason:
          type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        revokedBy:
          type:
            - string
            - "null"
          format: uuid
        revocationReason:
          type:
            - string
            - "null"
    PlatformRoleAssignmentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformRoleAssignment"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    GrantSuperAdminRequest:
      type: object
      required:
        - userId
        - reason
      properties:
        userId:
          type: string
          format: uuid
        reason: &id001
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo obligatorio; queda en auditoría.
    RevokeSuperAdminRequest:
      type: object
      required:
        - reason
      properties:
        reason: *id001
    ResendNotificationRequest:
      type: object
      required:
        - reason
      properties:
        reason: *id001
  responses:
    BadRequest:
      description:
        "Formato, sintaxis o estructura inválidos. Código: INVALID_REQUEST_FORMAT
        (detalle por campo en `errors`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Invalid request format
            status: 400
            detail: Invalid request format.
            instance: /api/v1/...
            code: INVALID_REQUEST_FORMAT
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    Unauthorized:
      description: "Autenticación ausente o inválida. Código: AUTHENTICATION_REQUIRED."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Authentication required
            status: 401
            detail: Authentication required.
            instance: /api/v1/...
            code: AUTHENTICATION_REQUIRED
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    Forbidden:
      description:
        "Autenticado sin permiso para la operación. Códigos: PERMISSION_DENIED;
        PASSWORD_CHANGE_REQUIRED en la Management y la Platform API mientras el usuario
        conserve su contraseña temporal."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Permission denied
            status: 403
            detail: Permission denied.
            instance: /api/v1/...
            code: PERMISSION_DENIED
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    NotFound:
      description:
        "Recurso inexistente o fuera del ámbito visible del principal.
        Código: RESOURCE_NOT_FOUND."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Resource not found
            status: 404
            detail: Resource not found.
            instance: /api/v1/...
            code: RESOURCE_NOT_FOUND
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    Conflict:
      description:
        "Conflicto con el estado del recurso o de idempotencia. Códigos
        según operación: IDEMPOTENCY_KEY_CONFLICT, NOTIFICATION_ALREADY_DISPATCHED,
        NOTIFICATION_NOT_RETRYABLE, RESOURCE_ALREADY_EXISTS, RESOURCE_STATE_CONFLICT."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Resource state conflict
            status: 409
            detail: Resource state conflict.
            instance: /api/v1/...
            code: RESOURCE_STATE_CONFLICT
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    PayloadTooLarge:
      description: "Archivo o cuerpo demasiado grande. Código: PAYLOAD_TOO_LARGE."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Payload too large
            status: 413
            detail: Payload too large.
            instance: /api/v1/...
            code: PAYLOAD_TOO_LARGE
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    UnsupportedMediaType:
      description: "Tipo de contenido no soportado. Código: UNSUPPORTED_MEDIA_TYPE."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unsupported media type
            status: 415
            detail: Unsupported media type.
            instance: /api/v1/...
            code: UNSUPPORTED_MEDIA_TYPE
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    UnprocessableContent:
      description:
        "Solicitud bien formada que incumple una regla de negocio. Códigos
        según operación: SENDER_NOT_CONNECTED, DEFAULT_SENDER_NOT_CONFIGURED, SENDER_NOT_ASSIGNED_TO_APPLICATION,
        TEMPLATE_VARIABLES_MISSING, ATTACHMENT_NOT_AVAILABLE, APPLICATION_LIMIT_EXCEEDS_ORGANIZATION_LIMIT,
        ROLE_NOT_ASSIGNABLE, LAST_SUPER_ADMIN_REVOCATION_FORBIDDEN, LAST_ORGANIZATION_ADMIN_REQUIRED,
        PROVIDER_DIAGNOSTICS_NOT_SUPPORTED, MEMBERSHIP_USER_NOT_FOUND, ENCRYPTION_OPTIONS_INVALID,
        API_KEY_SCOPE_NOT_PERMITTED, PASSWORD_CHANGE_REJECTED, PERMISSION_NOT_ASSIGNABLE,
        PASSWORD_POLICY_VIOLATION."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Default sender not configured
            status: 422
            detail: Default sender not configured.
            instance: /api/v1/...
            code: DEFAULT_SENDER_NOT_CONFIGURED
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    TooManyRequests:
      description:
        "Cuota o rate limit excedido. Códigos: WHATSAPP_DAILY_QUOTA_EXCEEDED,
        APPLICATION_DAILY_LIMIT_EXCEEDED, RATE_LIMIT_EXCEEDED. Incluye `Retry-After`
        y `retryAt` cuando son calculables."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: WhatsApp daily quota exceeded
            status: 429
            detail: WhatsApp daily quota exceeded.
            instance: /api/v1/...
            code: WHATSAPP_DAILY_QUOTA_EXCEEDED
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    ServiceUnavailable:
      description:
        "Dependencia temporalmente no disponible. Códigos: PROVIDER_TEMPORARILY_UNAVAILABLE,
        SERVICE_TEMPORARILY_UNAVAILABLE."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Provider temporarily unavailable
            status: 503
            detail: Provider temporarily unavailable.
            instance: /api/v1/...
            code: PROVIDER_TEMPORARILY_UNAVAILABLE
            traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  headers:
    RetryAfter:
      description:
        Segundos (o fecha HTTP) que el cliente debe esperar antes de reintentar.
        Se incluye cuando es calculable.
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description:
        Obligatorio para crear envíos, lotes, campañas y programaciones.
        Misma clave y mismo cuerpo devuelven el recurso original; misma clave con
        cuerpo distinto → 409 IDEMPOTENCY_KEY_CONFLICT.
      schema:
        type: string
        minLength: 8
        maxLength: 128
