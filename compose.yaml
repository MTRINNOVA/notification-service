name: notification-service

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  notification-api:
    <<: *defaults
    image: ${NOTIFICATION_API_IMAGE:-ghcr.io/mtrinnova/notification-api:${NOTIFICATION_IMAGE_TAG:-dev}}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OpenApi__Enabled: ${OpenApi__Enabled:-false}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-notification_service};Username=${POSTGRES_USER:-notification_user};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - notification_internal

  notification-worker:
    <<: *defaults
    image: ${NOTIFICATION_WORKER_IMAGE:-ghcr.io/mtrinnova/notification-worker:${NOTIFICATION_IMAGE_TAG:-dev}}
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-notification_service};Username=${POSTGRES_USER:-notification_user};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - notification_internal
      - notification_providers

  notification-scheduler:
    <<: *defaults
    image: ${NOTIFICATION_SCHEDULER_IMAGE:-ghcr.io/mtrinnova/notification-scheduler:${NOTIFICATION_IMAGE_TAG:-dev}}
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-notification_service};Username=${POSTGRES_USER:-notification_user};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - notification_internal
      - notification_providers

  postgres:
    <<: *defaults
    image: ${POSTGRES_IMAGE:-postgres:17.12-alpine3.24}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notification_service}
      POSTGRES_USER: ${POSTGRES_USER:-notification_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - notification_internal

  rabbitmq:
    <<: *defaults
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.4.1-management-alpine}
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-notification}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/notification}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - notification_internal

  redis:
    <<: *defaults
    image: ${REDIS_IMAGE:-redis:7.4.12-alpine}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - notification_internal

  minio:
    <<: *defaults
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-10-15T17-29-55Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - notification_internal

networks:
  notification_internal:
    name: ${NOTIFICATION_INTERNAL_NETWORK:-notification_internal}
  notification_providers:
    name: ${NOTIFICATION_PROVIDERS_NETWORK:-notification_providers}

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-notification_postgres_data}
  rabbitmq_data:
    name: ${RABBITMQ_VOLUME_NAME:-notification_rabbitmq_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-notification_redis_data}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-notification_minio_data}
