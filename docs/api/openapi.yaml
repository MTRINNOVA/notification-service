        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
  /public/templates/{code}:
    get:
      tags:
        - Public Notifications
      operationId: getPublicTemplate
      summary: Consultar plantilla publicada
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Consultar plantilla publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
  /management/organizations:
    get:
      tags:
        - Organizations
      operationId: listOrganizations
      summary: Listar organizacións
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Listar organizacións
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
    post:
      tags:
        - Organizations
      operationId: createOrganization
      summary: Crear organización
      security:
        - AdminBearer: []
      responses:
        "201":
          description: Crear organización
