          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMembershipRolesRequest"
      description:
        "Sustituye los roles de la membresía. Si la sustitución retira `organization_admin`
        de la última membresía activa que lo tiene, se rechaza. La validación
        es transaccional y bloquea las membresías administradoras activas de la organización
        para que dos solicitudes concurrentes no puedan dejarla sin administrador. El
        intento y su resultado se auditan.


        Códigos de error específicos: ROLE_NOT_ASSIGNABLE (422): `super_admin`
        o rol de otra organización; LAST_ORGANIZATION_ADMIN_REQUIRED (422): la operación dejaría a la organización sin ninguna membresía activa con el rol `organization_admin`."
  /management/organizations/{organizationId}/memberships/{membershipId}/status:
    patch:
      tags:
        - Organizations
      operationId: updateMembershipStatus
      summary: Cambiar estado de una membresía
      description:
        "Suspende, desactiva o reactiva el acceso de un usuario a una organización
        sin afectar a sus otras membresías ni a su cuenta global. Permitido a
        `organization_admin` de esa organización y a `super_admin` (con auditoría).
        Una membresía no activa deja de habilitar la organización en el contexto
        del usuario. No se puede suspender ni desactivar la última membresía activa
        con `organization_admin`: validación transaccional con bloqueo de
        las membresías administradoras activas de la organización; el intento y su
        resultado se auditan.


        Códigos de error específicos: LAST_ORGANIZATION_ADMIN_REQUIRED (422): la operación dejaría a la organización sin ninguna membresía activa con el rol `organization_admin`."
      security:
        - AdminBearer: []
      responses:
